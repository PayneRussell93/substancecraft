# PROD-08: the platform maths library rounds differently on each OS, so
# exports would differ between machines. Use `crate::math` instead.
disallowed-methods = [
    { path = "f32::sin", reason = "platform-dependent rounding; use math::sin" },
    { path = "f32::cos", reason = "platform-dependent rounding; use math::cos" },
    { path = "f32::sin_cos", reason = "platform-dependent rounding; use math::sin_cos" },
    { path = "f32::tan", reason = "platform-dependent rounding; use math::tan" },
    { path = "f32::asin", reason = "platform-dependent rounding; use math::asin" },
    { path = "f32::acos", reason = "platform-dependent rounding; use math::acos" },
    { path = "f32::atan", reason = "platform-dependent rounding; use math::atan" },
    { path = "f32::atan2", reason = "platform-dependent rounding; use math::atan2" },
    { path = "f32::exp", reason = "platform-dependent rounding; use math::exp" },
    { path = "f32::exp2", reason = "platform-dependent rounding; use math::powf" },
    { path = "f32::exp_m1", reason = "platform-dependent rounding; use math::exp" },
    { path = "f32::ln", reason = "platform-dependent rounding; use math::ln" },
    { path = "f32::ln_1p", reason = "platform-dependent rounding; use math::ln" },
    { path = "f32::log", reason = "platform-dependent rounding; use math::ln" },
    { path = "f32::log2", reason = "platform-dependent rounding; use math::log2" },
    { path = "f32::log10", reason = "platform-dependent rounding; use math::log10" },
    { path = "f32::powf", reason = "platform-dependent rounding; use math::powf" },
    { path = "f32::powi", reason = "unspecified rounding; use math::powi" },
    { path = "f32::cbrt", reason = "platform-dependent rounding; use math::powf" },
    { path = "f32::hypot", reason = "platform-dependent rounding; use math::hypot" },
    { path = "f32::sinh", reason = "platform-dependent rounding" },
    { path = "f32::cosh", reason = "platform-dependent rounding" },
    { path = "f32::tanh", reason = "platform-dependent rounding; use math::tanh" },
    { path = "f64::sin", reason = "platform-dependent rounding; use math::sin" },
    { path = "f64::cos", reason = "platform-dependent rounding; use math::cos" },
    { path = "f64::sin_cos", reason = "platform-dependent rounding; use math::sin_cos" },
    { path = "f64::tan", reason = "platform-dependent rounding; use math::tan" },
    { path = "f64::asin", reason = "platform-dependent rounding; use math::asin" },
    { path = "f64::acos", reason = "platform-dependent rounding; use math::acos" },
    { path = "f64::atan", reason = "platform-dependent rounding; use math::atan" },
    { path = "f64::atan2", reason = "platform-dependent rounding; use math::atan2" },
    { path = "f64::exp", reason = "platform-dependent rounding; use math::exp" },
    { path = "f64::exp2", reason = "platform-dependent rounding; use math::powf" },
    { path = "f64::exp_m1", reason = "platform-dependent rounding; use math::exp" },
    { path = "f64::ln", reason = "platform-dependent rounding; use math::ln" },
    { path = "f64::ln_1p", reason = "platform-dependent rounding; use math::ln" },
    { path = "f64::log", reason = "platform-dependent rounding; use math::ln" },
    { path = "f64::log2", reason = "platform-dependent rounding; use math::log2" },
    { path = "f64::log10", reason = "platform-dependent rounding; use math::log10" },
    { path = "f64::powf", reason = "platform-dependent rounding; use math::powf" },
    { path = "f64::powi", reason = "unspecified rounding; use math::powi" },
    { path = "f64::cbrt", reason = "platform-dependent rounding; use math::powf" },
    { path = "f64::hypot", reason = "platform-dependent rounding; use math::hypot" },
    { path = "f64::sinh", reason = "platform-dependent rounding" },
    { path = "f64::cosh", reason = "platform-dependent rounding" },
    { path = "f64::tanh", reason = "platform-dependent rounding; use math::tanh" },
]
