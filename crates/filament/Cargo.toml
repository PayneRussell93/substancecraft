[package]
name = "substancecraft-filament"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Isolated Filament runtime adapter for the SubstanceCraft viewport"
build = "build.rs"
links = "filament"

[dependencies]
glam.workspace = true
substancecraft-core = { path = "../core" }
thiserror.workspace = true

[build-dependencies]
cc = "1.2"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"