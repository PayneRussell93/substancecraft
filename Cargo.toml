[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/substancecraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
fbxcel = { version = "0.9", features = ["tree", "writer"] }
fbxcel-dom = "0.0.10"
glam = { version = "0.30", features = ["serde"] }
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "hdr", "bmp", "tiff", "webp", "exr"] }
exr = { version = "1.74", default-features = false }
resvg = { version = "0.45", default-features = false, features = ["text"] }
ab_glyph = "0.2"
quick-xml = "0.41"
epaint_default_fonts = "0.36"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io", "schemars"] }
rfd = "0.17"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"